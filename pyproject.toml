[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "t212client"
description = "Typed, read-only Rust-backed client for the Trading 212 API"
requires-python = ">=3.9"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
python-source = "python"
module-name = "t212client._core"
features = ["pyo3/extension-module"]